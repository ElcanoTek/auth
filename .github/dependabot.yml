# Dependabot proposes updates for auth's two dependency surfaces: the Go
# module at the repo root and the GitHub Actions used by CI. Modelled on
# fleet's .github/dependabot.yml, which has the long-form reasoning.
#
# - Daily polling, so an update is visible the day it becomes eligible.
# - Cooldown (gomod): wait 7 days (3 for patch releases) before proposing a
#   freshly published release, so a compromised version that the ecosystem
#   flags and yanks never reaches a PR. Cooldown applies to version updates
#   only; security updates are not delayed.
# - Minor + patch bumps are grouped into one PR per ecosystem; majors stay
#   separate for their own review.
# - Nothing merges itself. A human merges a bump only when it earns it: a
#   security fix whose code path we use, or a specific change we need (see
#   AGENTS.md › Dependencies and in-housed code). In-housed code
#   (internal/mfa/qr, the TOTP code) is ours and is not tracked here.
# - Not covered: the `go` line in go.mod (Dependabot does not move the
#   toolchain; that is a deliberate human change) and tool versions pinned
#   inside `run:` steps or the Makefile (gitleaks, shellcheck,
#   golangci-lint).
#
# auth has no `dev` branch, so updates target main (no target-branch).
version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 3
    commit-message:
      prefix: "deps(go)"
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
