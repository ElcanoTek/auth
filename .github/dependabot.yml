# Dependabot config — https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
# Go modules: security updates only (open-pull-requests-limit: 0 turns off
# version-update PRs; security PRs are not subject to the limit). We update a
# module for a CVE we reach or a specific upstream change, not on a schedule —
# see AGENTS.md › Dependencies and in-housed code. GitHub Actions: weekly
# version updates, bundled into one PR.
#
# auth has no `dev` branch, so updates target the default branch (main) —
# no target-branch override.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - go
    commit-message:
      prefix: chore(deps)
    groups:
      gomod:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore(ci)
    groups:
      github-actions:
        patterns:
          - "*"
