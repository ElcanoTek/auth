name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt -s check
        run: |
          unformatted="$(gofmt -s -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need 'gofmt -s -w .':"
            echo "$unformatted"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # v2.12+ release binaries are built with Go 1.25; older ones
          # (e.g. v2.1.x, built with 1.24) refuse to run against a go.mod
          # that targets 1.25. Keep this >= the go directive in go.mod.
          version: v2.12.0

  test:
    name: Vet & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Single source of truth: the `go` directive in go.mod. setup-go
          # resolves it to the latest matching patch release, so stdlib
          # security fixes land automatically without editing this file.
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: |
          go mod verify
          go mod tidy -diff

      - name: go vet
        run: go vet ./...

      - name: Test (race + coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage.out -timeout 5m ./...

      - name: Coverage summary
        run: |
          echo '### Go test coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Smoke (magic-link e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        run: make build

      - name: Boot auth-server + drive a full magic-link round-trip
        # scripts/smoke.sh starts the real binary on loopback with the
        # stdout email driver and a throwaway SQLite dir, then asserts the
        # security-critical flow: anon /verify is 401, an allowed-domain
        # magic link logs in and sets the cookie, /verify then returns the
        # identity headers, the link is single-use, and a disallowed domain
        # emits no email (no enumeration oracle). No secrets, no network.
        run: bash scripts/smoke.sh

  govulncheck:
    name: govulncheck (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory, not blocking. govulncheck flags stdlib CVEs whose only fix is
    # bumping the Go toolchain — a separate action that shouldn't redden a PR's
    # required checks. Treat a red run as "investigate + bump Go", not "blocked".
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo '### govulncheck (advisory)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          "$(go env GOPATH)/bin/govulncheck" ./... 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

  shellcheck:
    name: ShellCheck (deploy scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: ShellCheck the deploy/ops scripts
        # These scripts run as root and do destructive things (install
        # binaries, rm staging dirs) — the highest-blast-radius code in the
        # repo — so lint them on every PR. Pin the shellcheck version (download
        # the official static binary) instead of using the runner image's
        # bundled one: its version drifts across image updates, so a finding
        # could appear (or vanish) here without any change to a local run.
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJf - --strip-components=1 "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          ./shellcheck --version
          ./shellcheck scripts/*.sh scripts/lib/*.sh deploy/auth-cli
