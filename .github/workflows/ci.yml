name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# PRs: one run per ref, a new push cancels the old one. Pushes to main and
# manual runs: one group per commit, so every main commit gets its own CI run
# (GitHub keeps only one pending run per group and would drop the rest).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan the repository
        run: gitleaks dir . --redact --exit-code 1

      - name: Scan Git history
        run: gitleaks git . --log-opts="--all" --redact --exit-code 1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Frontend standard (stack-check)
        # Offline: stack.conf, the shared AGENTS.md block, flag.lock against
        # the vendored Flag files, and no remote script/style/font hosts.
        # The weekly flag-drift workflow compares with Flag upstream.
        run: scripts/stack-check.sh

      - name: gofmt -s check
        run: |
          unformatted="$(gofmt -s -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need 'gofmt -s -w .':"
            echo "$unformatted"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # The binary must be built with a Go at least as new as go.mod's
          # `go` line (v2.14.0 is the first that runs against 1.27). Keep in
          # step with GOLANGCI_VERSION in the Makefile.
          version: v2.14.0

  test:
    name: Vet & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Single source of truth: the `go` directive in go.mod. setup-go
          # resolves it to the latest matching patch release, so stdlib
          # security fixes land automatically without editing this file.
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: |
          go mod verify
          go mod tidy -diff

      - name: go vet
        run: go vet ./...

      - name: Test (race + coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage.out -timeout 5m ./...

      - name: Coverage summary
        run: |
          {
            echo '### Go test coverage'
            echo '```'
            go tool cover -func=coverage.out | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Smoke (magic + password + app handoff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        run: make build

      - name: Boot auth-server + drive both authentication modes and app handoff
        # make smoke starts real binaries with throwaway SQLite databases. It
        # covers legacy magic links plus password login, forced replacement,
        # confidential-client registration, the Explorer S256-PKCE exchange,
        # one-use code replay rejection, and CSRF logout. No real secrets or
        # external network calls.
        run: make smoke

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        # @latest, as upstream Go documents and fleet runs it: a pin nobody
        # bumps costs detection as the analysis improves, and the advisory
        # database is fetched live either way, so this job can turn red with
        # no commit involved — that is the gate working. If a bad release
        # ever blocks every PR, pinning here is the one-line rollback.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          set +e
          output="$("$(go env GOPATH)/bin/govulncheck" ./... 2>&1)"
          status=$?
          set -e
          {
            echo '### govulncheck'
            echo '```'
            printf '%s\n' "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$output"
          exit "$status"

  shellcheck:
    name: ShellCheck (deploy scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ShellCheck the deploy/ops scripts
        # These scripts run as root and do destructive things (install
        # binaries, rm staging dirs) — the highest-blast-radius code in the
        # repo — so lint them on every PR. Pin the shellcheck version (download
        # the official static binary) instead of using the runner image's
        # bundled one: its version drifts across image updates, so a finding
        # could appear (or vanish) here without any change to a local run.
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJf - --strip-components=1 "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          ./shellcheck --version
          ./shellcheck install.sh scripts/*.sh scripts/lib/*.sh scripts/test/*.sh deploy/auth-cli

      - name: Test the public installer
        run: sudo bash scripts/test/install_test.sh
