name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan the repository
        run: gitleaks dir . --redact --exit-code 1

      - name: Scan Git history
        run: gitleaks git . --log-opts="--all" --redact --exit-code 1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt -s check
        run: |
          unformatted="$(gofmt -s -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need 'gofmt -s -w .':"
            echo "$unformatted"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # v2.12+ release binaries are built with Go 1.25; older ones
          # (e.g. v2.1.x, built with 1.24) refuse to run against a go.mod
          # that targets 1.25. Keep this >= the go directive in go.mod.
          version: v2.12.0

  test:
    name: Vet & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Single source of truth: the `go` directive in go.mod. setup-go
          # resolves it to the latest matching patch release, so stdlib
          # security fixes land automatically without editing this file.
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: |
          go mod verify
          go mod tidy -diff

      - name: go vet
        run: go vet ./...

      - name: Test (race + coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage.out -timeout 5m ./...

      - name: Coverage summary
        run: |
          echo '### Go test coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Smoke (magic + password + app handoff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        run: make build

      - name: Boot auth-server + drive both authentication modes and app handoff
        # make smoke starts real binaries with throwaway SQLite databases. It
        # covers legacy magic links plus password login, forced replacement,
        # confidential-client registration, the Explorer S256-PKCE exchange,
        # one-use code replay rejection, and CSRF logout. No real secrets or
        # external network calls.
        run: make smoke

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        # Pinned, not @latest: govulncheck v1.8.0 requires Go 1.26 while this
        # job runs the go.mod toolchain (1.25) under GOTOOLCHAIN=local, so
        # @latest failed to build and the job was red without ever scanning.
        # v1.1.4 is the last release that builds on 1.25 (go 1.22.0 directive);
        # its vulnerability database is fetched live, so pinning the tool does
        # not pin the advisories. Bump the pin when the Go toolchain is bumped.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          set +e
          output="$("$(go env GOPATH)/bin/govulncheck" ./... 2>&1)"
          status=$?
          set -e
          {
            echo '### govulncheck'
            echo '```'
            printf '%s\n' "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$output"
          exit "$status"

  shellcheck:
    name: ShellCheck (deploy scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: ShellCheck the deploy/ops scripts
        # These scripts run as root and do destructive things (install
        # binaries, rm staging dirs) — the highest-blast-radius code in the
        # repo — so lint them on every PR. Pin the shellcheck version (download
        # the official static binary) instead of using the runner image's
        # bundled one: its version drifts across image updates, so a finding
        # could appear (or vanish) here without any change to a local run.
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJf - --strip-components=1 "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          ./shellcheck --version
          ./shellcheck install.sh scripts/*.sh scripts/lib/*.sh scripts/test/*.sh deploy/auth-cli

      - name: Test the public installer
        run: sudo bash scripts/test/install_test.sh
