name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "53 4 * * 1"

# PRs share a group per ref and cancel superseded runs. Every other event
# (pushes to main, schedules) gets its own group per commit: a shared group
# keeps only one pending run, so a third push would drop the second's run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Upload of results to code scanning.
      security-events: write
      actions: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Go needs a real build: CodeQL extracts Go from the compiler's view
          # of the packages, so autobuild runs `go build` with the toolchain
          # setup-go installs from go.mod.
          - language: go
            build-mode: autobuild
          # The workflows themselves (injection via untrusted context,
          # unpinned actions, over-broad permissions). Nothing to build.
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"
