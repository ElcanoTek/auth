<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160" role="img">
  <title>In the app, tap + and choose to enter a setup key</title>
  <rect width="240" height="160" rx="10" fill="#eef1f6"/>
  <rect x="64" y="10" width="104" height="142" rx="12" fill="#1f2430"/>
  <rect x="70" y="20" width="92" height="124" rx="5" fill="#ffffff"/>
  <text x="77" y="34" font-size="8" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" fill="#1f2430">Authenticator</text>
  <rect x="77" y="40" width="78" height="10" rx="2" fill="#eef1f6"/>
  <rect x="77" y="54" width="78" height="10" rx="2" fill="#eef1f6"/>
  <rect x="70" y="80" width="92" height="64" rx="5" fill="#f6f7fb"/>
  <text x="80" y="98" font-size="7.5" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" fill="#1f2430">Scan a QR code</text>
  <rect x="74" y="106" width="84" height="16" rx="4" fill="#4f46e5"/>
  <text x="80" y="117" font-size="7.5" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" fill="#ffffff">Enter a setup key</text>
  <circle cx="200" cy="62" r="13" fill="#4f46e5"/>
  <path d="M200 55 v14 M193 62 h14" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M186 66 q-8 6 -16 6" stroke="#4f46e5" stroke-width="1.5" fill="none" stroke-dasharray="3 2"/>
  <text x="200" y="88" text-anchor="middle" font-size="8" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" fill="#8a93a6">tap +</text>
  <rect x="6" y="104" width="54" height="22" rx="4" fill="#ffffff" stroke="#c9cfdb"/>
  <text x="33" y="118" text-anchor="middle" font-size="7" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1f2430">ABCD EFGH…</text>
  <text x="33" y="138" text-anchor="middle" font-size="7.5" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" fill="#8a93a6">paste the key</text>
</svg>
