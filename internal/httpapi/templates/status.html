<!doctype html>
<html lang="{{language}}" data-language-sync="{{.LanguageCanChange}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{.Wordmark}} — {{tr .Title}}</title>
{{if .LogoURL}}<link rel="icon" href="{{.LogoURL}}">{{end}}
{{template "assets" .}}
</head>
<body>
  {{template "language-choice" .}}
  {{template "theme-toggle"}}
  <main class="card">
    {{if .LogoURL}}<img class="mark" src="{{.LogoURL}}" alt="">{{end}}
    <div class="brand">{{.Wordmark}}</div>
    <h1>{{tr .Title}}</h1>
    <p class="muted">{{tr .Message}}</p>
    <a class="btn btn-primary" href="/">{{tr "Back to sign-in"}}</a>
  </main>
</body>
</html>
